spring.application.name=clinkNBuy-REST
#Server Properties
server.port=8080

#Database Properties 
spring.datasource.url=jdbc:mysql://localhost:3306/clicknbuy?createDatabaseIfNotExist=true
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Email Properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL}
spring.mail.password=${APP_PWD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
jwt.secret=thisIsMyVeryLongAndSecureSecretKeyForClinkNBuy2025!

logging.level.org.springframework.security=debug

# Razorpay (Dummy values to bypass startup crash)
razorpay_key=your_razorpay_key
razorpay_secret= your_razorpay_secret_key
# Email (Dummy values to bypass startup crash)
EMAIL=dummy@gmail.com
APP_PWD=dummy_password